# Configuracion completa para desplegar TRINITY en Render
# Este archivo permite desplegar el backend y frontend automaticamente

services:
  # Backend API
  - type: web
    name: trinity-backend
    runtime: node
    region: oregon
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: cd backend && npm ci
    startCommand: cd backend && npm run init-db && npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trinity-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

  # Frontend (Static Site)
  - type: web
    name: trinity-frontend
    runtime: static
    region: oregon
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        # Backend publicado actualmente para el frontend de produccion.
        value: https://trinity-backend-meda.onrender.com

databases:
  - name: trinity-db
    databaseName: trinity_uc73
    user: trinity
    plan: free
    region: oregon
